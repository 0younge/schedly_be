server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: schedly-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-jwt-secret-change-me}
    expires-in-seconds: ${APP_JWT_EXPIRES_IN_SECONDS:3600}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
